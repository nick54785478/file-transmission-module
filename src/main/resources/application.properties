spring.application.name=file-transmission-module
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=file-transmission;trustServerCertificate=true;encrypt=false;sendStringParametersAsUnicode=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=Root@123456
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# File Transmission Async Thread Pool Configuration
transmission.async.core-pool-size=4
transmission.async.max-pool-size=16
transmission.async.queue-capacity=100
transmission.async.thread-name-prefix=transmission-async-
transmission.async.wait-for-tasks-to-complete-on-shutdown=true
transmission.async.await-termination-seconds=30

# Character Encoding & Logging Charset
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Transmission Security Configuration (AES-GCM Key for ENC(...))
# 優先讀取環境變數 TRANSMISSION_SECRET_KEY，未設置時由 Spring 啟動配置判定或備援
transmission.security.secret-key=${TRANSMISSION_SECRET_KEY:}

# Spring Boot SQL Data Initialization Configuration (data.sql)
# 啟用 data.sql 於應用程式啟動時自動執行初始化腳本
spring.sql.init.mode=always
# 指定 data.sql 腳本檔案讀取編碼為 UTF-8 (防止 Windows 平台讀取中文亂碼)
spring.sql.init.encoding=UTF-8
# 延遲 SQL 腳本初始化至 Hibernate DDL (create/update) 建立資料表結構之後執行
spring.jpa.defer-datasource-initialization=true