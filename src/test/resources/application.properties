spring.application.name=file-transmission-module-test
spring.datasource.url=jdbc:h2:mem:file_transmission_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# SpringDoc OpenAPI
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Async
transmission.async.core-pool-size=4
transmission.async.max-pool-size=16
transmission.async.queue-capacity=100
transmission.async.thread-name-prefix=transmission-test-async-
transmission.async.wait-for-tasks-to-complete-on-shutdown=true
transmission.async.await-termination-seconds=30
